# LaneRobot row-anchor dataset template
# Label format per line:
#   lane_id x1 y1 x2 y2 ... x56 y56
# x is normalized [0,1]; x=-1 means absent/no-lane. y is normalized [0,1].
# Paths are relative to the repository root when launched through train.py.

path: datasets/datasets
train: images/train
val: images/valid

# Use the manually corrected labels instead of the default images/... -> labels/... convention.
train_labels: labels_corrected/train
val_labels: labels_corrected/valid
strict_labels: true

x_grids: 160
row_anchors: 56
num_lanes: 4
y_start: 1.0
y_end: 0.3333333333
channels: 3
nc: 4
names:
  0: lane_task_0
  1: lane_task_1
  2: lane_task_2
  3: lane_task_3
